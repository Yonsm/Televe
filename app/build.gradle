plugins {
    id 'com.android.application'
}

apply from: '../constants.gradle'

def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localProps.load(new FileInputStream(localFile))
}
def releaseSigningProperties = [
        'RELEASE_STORE_FILE',
        'RELEASE_STORE_PASSWORD',
        'RELEASE_KEY_ALIAS',
        'RELEASE_KEY_PASSWORD'
]
def missingReleaseSigningProperties = releaseSigningProperties.findAll {
    localProps.getProperty(it)?.trim() == null
}

android {
    namespace 'net.yonsm.televe'
    compileSdk project.ext.compileSdkVersion

    compileOptions {
        sourceCompatibility project.ext.javaVersion
        targetCompatibility project.ext.javaVersion
    }

    defaultConfig {
        applicationId "net.yonsm.televe"
        minSdk project.ext.minSdkVersion
        targetSdk project.ext.targetSdkVersion
        versionCode 6
        versionName '2.1.4'
        buildConfigField 'String', 'BUILD_TIME', '"' + new Date().format('MMddHHmm', TimeZone.getTimeZone('Asia/Shanghai')) + '"'
    }

    splits {
        abi {
            enable !gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains('bundle') }
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    packaging {
        jniLibs.excludes += ['**/x86/**', '**/x86_64/**']
    }

    // 签名密钥一律从 local.properties(已 gitignore)读取，Gradle 文件不存任何明文密码。
    signingConfigs {
        release {
            if (missingReleaseSigningProperties.isEmpty()) {
                storeFile file(localProps.getProperty('RELEASE_STORE_FILE'))
                storePassword localProps.getProperty('RELEASE_STORE_PASSWORD')
                keyAlias localProps.getProperty('RELEASE_KEY_ALIAS')
                keyPassword localProps.getProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (missingReleaseSigningProperties.isEmpty()) {
                signingConfig signingConfigs.release
            }
            jniDebuggable true
            minifyEnabled false
            proguardFiles 'proguard-rules.pro', getDefaultProguardFile('proguard-android-optimize.txt')
        }
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles 'proguard-rules.pro', getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError true
    }
}

tasks.register('verifyReleaseSigning') {
    doLast {
        if (!missingReleaseSigningProperties.isEmpty()) {
            throw new GradleException('Release signing requires local.properties: '
                    + missingReleaseSigningProperties.join(', '))
        }
        if (!file(localProps.getProperty('RELEASE_STORE_FILE')).isFile()) {
            throw new GradleException('Release signing keystore does not exist')
        }
    }
}

tasks.configureEach {
    if (name in ['assembleRelease', 'bundleRelease', 'packageRelease']) {
        dependsOn('verifyReleaseSigning', 'lintRelease')
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find()?.identifier
            output.outputFileName.set(output.versionName.map { "Televe_${it}${abi ? '_' + abi : ''}.apk" })
        }
    }
}

dependencies {
    implementation project(':library')

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'

    // 媒体播放
    implementation 'androidx.media3:media3-common:' + project.ext.media3Version
    implementation 'androidx.media3:media3-exoplayer-dash:' + project.ext.media3Version
    implementation 'androidx.media3:media3-exoplayer-hls:' + project.ext.media3Version

    testImplementation 'junit:junit:4.13.2'
}
